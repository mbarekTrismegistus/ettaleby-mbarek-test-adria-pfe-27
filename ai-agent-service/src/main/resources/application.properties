spring.application.name=ai-agent-service
server.port=8083
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.timeout=20s
# Never retry a conversation automatically: a tool may already have moved money.
spring.ai.openai.chat.max-retries=0
spring.ai.openai.chat.parallel-tool-calls=false
spring.ai.tools.limits.max-total-tool-calls=12
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.ai.mcp.client.name=banking-agent
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.request-timeout=10s
spring.ai.mcp.client.streamable-http.connections.accounts.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.accounts.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.transactions.url=${TRANSACTION_MCP_URL:http://localhost:8082}
spring.ai.mcp.client.streamable-http.connections.transactions.endpoint=/mcp

bank.agent.memory.max-messages=20
