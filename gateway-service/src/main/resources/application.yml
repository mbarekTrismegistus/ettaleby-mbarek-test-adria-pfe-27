spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # REST APIs: paths are unique, forwarded as-is
            - id: account-rest
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accountService
                    fallbackUri: forward:/fallback/account-service
            - id: transaction-rest
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: transactionService
                    fallbackUri: forward:/fallback/transaction-service
            - id: agent-rest
              uri: lb://ai-agent-service
              predicates:
                - Path=/api/agent/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: agentService
                    fallbackUri: forward:/fallback/ai-agent-service
            # GraphQL and MCP share the same path (/graphql, /mcp) in every service:
            # they are reached through a service prefix that is stripped before forwarding
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/account-service/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: accountService
                    fallbackUri: forward:/fallback/account-service
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/transaction-service/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: transactionService
                    fallbackUri: forward:/fallback/transaction-service
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: http://localhost:4200
                allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
                allowed-headers: '*'
                exposed-headers: Mcp-Session-Id
          httpclient:
            connect-timeout: 2000

server:
  port: 8080

# one circuit per downstream service; generous timeout because the AI agent waits for the LLM
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 60s
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

