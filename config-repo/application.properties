# shared by every service (service-specific files override these values)

# service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
eureka.client.registry-fetch-interval-seconds=5
# client-side load balancer: refresh the instance list every 5s (default 35s)
spring.cloud.loadbalancer.cache.ttl=5s

# observability
management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers,circuitbreakerevents,retries
management.endpoint.health.show-details=always
