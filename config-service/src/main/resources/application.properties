spring.application.name=config-service
server.port=8888

# native backend: configuration files are read from config-repo/ (a Git repository would be used in production)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:./config-repo,file:../config-repo}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
