spring.application.name=discovery-service
server.port=8761

# standalone registry: does not register itself nor fetch from a peer
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost
# dev setting: evict stopped instances quickly instead of protecting the registry
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
# serve the live registry instead of a 30s cached snapshot
eureka.server.use-read-only-response-cache=false
eureka.server.response-cache-update-interval-ms=3000
